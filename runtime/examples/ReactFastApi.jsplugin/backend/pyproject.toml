[project]
name = "graaly-react-fastapi-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "greenlet==3.5.5",
  "pydantic-settings==2.15.0",
  "PyJWT==2.13.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4"
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==9.0.3"
]

[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["alembic*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
