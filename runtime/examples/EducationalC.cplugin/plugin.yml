name: EducationalC
version: 1.0.0
main: dist/plugin.wasm
author: Graaly
description: Educational C plugin using structs, bitsets, shifts, tagged unions, alignment, padding, and explicit byte formats.
commands:
  cplayer:
    description: Build and print a user-defined Player struct snapshot.
    usage: /cplayer [note]
  ccatalog:
    description: Resolve canonical Player and Material.STONE through the universal C bridge.
    usage: /ccatalog
  cmemory:
    description: Inspect a DEADBEEF canary and poisoned C buffer.
    usage: /cmemory
  cbits:
    description: Inspect unsigned masks, bounded shifts, and a 128-bit selection bitset.
    usage: /cbits
  cunion:
    description: Inspect a tagged union and reject an inactive member read.
    usage: /cunion
  clayout:
    description: Measure struct padding and alignment and round-trip a 7-byte record.
    usage: /clayout
  cheap:
    description: Inspect Graaly's teaching heap, logical free, and DEADBEEF poison.
    usage: /cheap
  coverflow:
    description: Corrupt one teaching red-zone byte and detect the logical buffer overflow.
    usage: /coverflow
  csegfault:
    description: Intentionally trigger a sandboxed WebAssembly memory trap.
    usage: /csegfault
    permission: graaly.c.lab.unsafe
permissions:
  graaly.c.lab.unsafe:
    description: Allows intentionally faulting the EducationalC guest.
    default: op
